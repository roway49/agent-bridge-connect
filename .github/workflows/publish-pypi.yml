name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Generate build identity
        env:
          BUILD_SOURCE: ${{ github.event_name == 'release' && 'github-release' || 'github-manual' }}
        run: python3 scripts/build_provenance.py generate-build-info --build-source "$BUILD_SOURCE"

      - name: Run provenance validation
        if: github.event_name == 'release' && github.event.action == 'published'
        run: python3 scripts/build_provenance.py validate --tag "${{ github.event.release.tag_name }}"

      - name: Build distributions
        run: python -m build

      - name: Check package metadata (Twine)
        run: python -m twine check dist/*

      - name: Validate distribution filenames
        run: python3 scripts/build_provenance.py validate-dists

      - name: Generate release manifest
        env:
          MANIFEST_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          if [ -n "$MANIFEST_TAG" ]; then
            python3 scripts/build_provenance.py generate-manifest --tag "$MANIFEST_TAG"
          else
            python3 scripts/build_provenance.py generate-manifest
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish agentbc
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentbc
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/

      - name: Verify manifest and artifact hashes
        run: |
          python3 - <<'PY'
          import json, hashlib, sys
          from pathlib import Path

          manifest = json.loads(Path("dist/release-manifest.json").read_text(encoding="utf-8"))
          errors = []
          for art in manifest["artifacts"]:
              fp = Path("dist") / art["filename"]
              if not fp.is_file():
                  errors.append(f"artifact missing: {art['filename']}")
                  continue
              actual_sha = hashlib.sha256(fp.read_bytes()).hexdigest()
              if actual_sha != art["sha256"]:
                  errors.append(
                      f"hash mismatch for {art['filename']}: "
                      f"manifest={art['sha256'][:16]}… actual={actual_sha[:16]}…"
                  )
          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("All manifest artifact hashes verified.")
          PY

      - name: Upload GitHub Release assets
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/release-manifest.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
