name: Publish AgentBC 1.0.3A GitHub Release

on:
  push:
    tags:
      - "v1.0.3A2"

permissions:
  actions: write
  contents: write

jobs:
  publish-release:
    name: Build and publish the 1.0.3A release assets
    runs-on: macos-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "build==1.5.0" \
            "twine==6.2.0"

      - name: Validate tag and build identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v1.0.3A2"
          python3 scripts/build_provenance.py generate-build-info \
            --build-source github-release
          python3 scripts/build_provenance.py validate --tag "$RELEASE_TAG"

      - name: Build and verify macOS release bundle
        env:
          AGENTBC_BUILD_PYTHON: python3
          ASSET_ROOT: ${{ runner.temp }}/agentbc-release-assets
        run: |
          ./scripts/build_local_alpha_bundle.sh "$ASSET_ROOT"
          product_version="$(python3 scripts/build_provenance.py print-product-version)"
          bundle_dir="$ASSET_ROOT/agentbc-$product_version-macos-local-alpha"
          archive="$ASSET_ROOT/agentbc-$product_version-macos-local-alpha.tar.gz"
          (cd "$ASSET_ROOT" && shasum -a 256 -c "$(basename "$archive").sha256")
          (cd "$bundle_dir" && shasum -a 256 -c SHA256SUMS)
          python -m twine check "$bundle_dir"/*.whl "$bundle_dir"/*.tar.gz
          python3 scripts/build_provenance.py validate-dists --dist-dir "$bundle_dir"

      - name: Prepare release notes
        env:
          NOTES_FILE: ${{ runner.temp }}/agentbc-release-notes.md
        run: |
          awk '
            /^## 1\.0\.3A - / { keep = 1; next }
            /^## / && keep { exit }
            keep { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          test -s "$NOTES_FILE"

      - name: Publish GitHub release with macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_ROOT: ${{ runner.temp }}/agentbc-release-assets
          NOTES_FILE: ${{ runner.temp }}/agentbc-release-notes.md
        run: |
          product_version="$(python3 scripts/build_provenance.py print-product-version)"
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --latest \
            --title "AgentBC 1.0.3A" \
            --notes-file "$NOTES_FILE" \
            "$ASSET_ROOT/agentbc-$product_version-macos-local-alpha.tar.gz" \
            "$ASSET_ROOT/agentbc-$product_version-macos-local-alpha.tar.gz.sha256" \
            "$ASSET_ROOT/install-agentbc-alpha.sh" \
            "$ASSET_ROOT/uninstall-agentbc-alpha.sh"

      - name: Dispatch Trusted Publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh workflow run publish-pypi.yml \
            --repo "${{ github.repository }}" \
            --ref "$RELEASE_TAG" \
            --field release_tag="$RELEASE_TAG" \
            --field publish=true
