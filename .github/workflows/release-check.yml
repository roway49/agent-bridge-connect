name: Release Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "build==1.5.0" \
            "ruff==0.15.22" \
            "twine==6.2.0"

      - name: Run static checks
        run: |
          ruff check src
          PYTHONPATH=src PYTHONPYCACHEPREFIX=/tmp/agentbc-pycache python -m compileall -q src
          PYTHONPATH=src PYTHONPYCACHEPREFIX=/tmp/agentbc-pycache python -m unittest discover -s tests -v
          sh -n scripts/*.sh
          git diff --check

      - name: Generate build identity
        run: python3 scripts/build_provenance.py generate-build-info --build-source ci

      - name: Build distributions
        run: python -m build

      - name: Check package metadata (Twine)
        run: python -m twine check dist/*

      - name: Validate distribution filenames
        run: python3 scripts/build_provenance.py validate-dists

      - name: Generate release manifest
        run: python3 scripts/build_provenance.py generate-manifest

      - name: Generate Homebrew formula
        run: |
          python3 scripts/generate_homebrew_formula.py \
            dist/release-manifest.json \
            --output dist/agentbc.rb
          ruby -c dist/agentbc.rb

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Run package smoke
        run: |
          AGENTBC_BIN=agentbc PYTHON_BIN=python ./scripts/run_local_alpha_smoke.sh
